name: Build & Release Windows Desktop App (.exe)

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Desktop App (.exe)
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0-#${{ github.run_number }}
          releaseName: 'Skillage Mart Desktop v1.0.0 (#${{ github.run_number }})'
          releaseBody: 'Rilis otomatis aplikasi installer desktop Windows (.exe) Skillage Mart POS.'
          releaseDraft: true
          prerelease: false

      - name: Upload Windows Installer Artifact (Auto-Delete 3 Hari)
        uses: actions/upload-artifact@v4
        with:
          name: Skillage-Mart-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 3

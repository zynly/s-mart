name: Build & Release Desktop Apps (Windows & Linux)

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            artifact_name: 'Skillage-Mart-Windows'
          - platform: 'ubuntu-latest'
            artifact_name: 'Skillage-Mart-Linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Desktop Package
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0-#${{ github.run_number }}
          releaseName: 'Skillage Mart Desktop v1.0.0 (#${{ github.run_number }})'
          releaseBody: 'Rilis otomatis installer desktop Windows (.exe) dan Linux (.AppImage / .deb) Skillage Mart POS.'
          releaseDraft: true
          prerelease: false

      - name: Upload Artifacts (Auto-Delete 3 Hari)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 3
